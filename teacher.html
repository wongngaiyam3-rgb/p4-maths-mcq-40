<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>教師平台｜小四數學40題</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./"><b>∑</b>ivan’s learning-explorer</a><a class="navlink" href="./">學生入口 ↗</a></header><main class="wrap"><section id="login" class="card teacherintro"><div class="eyebrow">TEACHER DASHBOARD</div><h1>看見每一步學習。</h1><p class="muted">登入後，按班別和學號查看學生的作答進度及成績。</p><form id="loginform"><label>教師密碼<input id="password" type="password" autocomplete="current-password" required maxlength="100"></label><button class="primary wide" id="loginbutton">登入教師平台 →</button></form><div id="loginerror" class="alert" role="alert"></div></section><section id="dashboard" hidden><div class="sectionhead"><div><div class="eyebrow">2026–2027 · PRIMARY 4 MATHEMATICS</div><h1>學生學習概覽</h1></div><button class="small" id="logout">登出</button></div><p class="muted">40題數學測驗 · 4A–4C · 每班1–25號</p><div id="error" class="alert" role="alert"></div><div class="toolbar"><label>班別<select id="class"><option value="">全部班別</option><option>4A</option><option>4B</option><option>4C</option></select></label><label>學號<select id="number"></select></label><label>完成情況<select id="status"><option value="">全部情況</option><option value="not_started">未開始</option><option value="in_progress">作答中</option><option value="completed">已完成</option></select></label><button class="primary" id="refresh">重新整理</button><button class="secondary" id="csv">匯出CSV</button></div><div id="stats" class="stats"></div><label class="checkline"><input type="checkbox" id="history">顯示所有作答紀錄（預設每位學生最新一次）</label><div class="tablewrap"><table><thead><tr><th>班別</th><th>學號</th><th>完成情況</th><th>已答題數</th><th>分數</th><th>作答時間</th><th>最後更新（香港）</th><th>詳細資料</th></tr></thead><tbody id="rows"></tbody></table></div><p id="count" class="help" aria-live="polite"></p><p class="help">「未開始」按75個班別／學號組合及雲端紀錄判定。班別與學號由學生自行選擇，未經額外身分驗證。重新整理可取得最新紀錄。</p></section></main><dialog id="detail"><div class="detailtop"><h2 id="detailtitle"></h2><button class="small" id="closeDetail">關閉</button></div><div id="detailbody"></div></dialog><script type="module" src="teacher.js"></script></body></html>
